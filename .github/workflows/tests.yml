name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libs for Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (no webcam needed)
        # test_touchless_interaction waits on a live camera feed, so it is skipped in CI
        run: |
          python -m unittest -v \
            tests.test_document tests.test_filters tests.test_gestures \
            tests.test_end_to_end_gestures tests.test_gui_integration tests.test_vision_camera
